name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Скачать исходники
        uses: actions/checkout@v4

      - name: Поставить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Подставить свои ключи Telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = [0-9]*;/APP_ID = $TG_API_ID;/" $F
          sed -i "s/APP_HASH = \"[^\"]*\";/APP_HASH = \"$TG_API_HASH\";/" $F
          echo "Строк с твоим APP_ID: $(grep -c "APP_ID = $TG_API_ID;" $F)"

      - name: Показать доступные задачи сборки (для диагностики)
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:tasks --all --no-daemon | grep -i assemble || true

      - name: Собрать APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk
          path: "/build/outputs/apk//*.apk"
          retention-days: 14
          if-no-files-found: error
